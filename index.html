<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Octopus Africa Property</title>

<link rel="shortcut icon" href="/favicon.ico?v=6">
<style>
/* Load the actual uploaded DaoLiTi file from the repository root. */
@font-face {
  font-family: "OAP DaoLi";
  src: url("./AlimamaDaoLiTi-Regular.otf?v=20261017") format("opentype");
  font-style: normal;
  font-weight: 400;
  font-display: swap;
}

:root{
  --bg:#0f5964;
  --bg-deep:#0b4c55;
  --line:rgba(255,255,255,.10);
  --line-strong:rgba(255,255,255,.18);
  --text:#f7f5ef;
  --muted:rgba(247,245,239,.78);
  --accent:#e6a63a;
  --shadow:0 18px 60px rgba(0,0,0,.18);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  overflow:hidden;
  color:var(--text);
  background:
    radial-gradient(circle at 50% 45%, rgba(255,255,255,.05), transparent 34%),
    radial-gradient(circle at 85% 12%, rgba(230,166,58,.08), transparent 22%),
    linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
  font-family:"Avenir Next",Avenir,"Helvetica Neue",Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";
  position:fixed;
  inset:22px;
  border:1px solid rgba(255,255,255,.05);
  pointer-events:none;
}
.page{
  min-height:100svh;
  width:min(1240px, calc(100% - 48px));
  margin:0 auto;
  display:grid;
  grid-template-rows:auto minmax(0,1fr) auto;
}
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:14px;
  padding:22px 0 6px;
  position:relative;
  z-index:5;
}
.language-control{position:relative;display:flex;align-items:center}
.language-control::before{content:"◉";position:absolute;left:15px;color:var(--accent);font-size:13px;pointer-events:none}
.language-control select{appearance:none;-webkit-appearance:none;border:1px solid var(--line-strong);border-radius:999px;background:rgba(255,255,255,.07);color:var(--text);font:inherit;font-size:13px;letter-spacing:.02em;padding:12px 36px 12px 35px;min-width:157px;cursor:pointer;transition:background .25s,border-color .25s}
.language-control::after{content:"⌄";position:absolute;right:15px;top:43%;transform:translateY(-50%);pointer-events:none;color:var(--text);font-size:19px}
.language-control select:hover{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.3)}
.language-control select:focus-visible,.email:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.language-control option{background:#0b4c55;color:white}
.hero{
  display:grid;
  place-items:center;
  padding:8px 0 24px;
}
.wrap{
  width:min(1120px,100%);
  display:grid;
  grid-template-columns:minmax(320px, 450px) minmax(360px,1fr);
  align-items:center;
  gap:54px;
  transform:translateX(-34px);
}
.logo-zone{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
}
.logo-zone::before{
  content:"";
  position:absolute;
  width:min(48vw,560px);
  height:min(48vw,560px);
  border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,.07), transparent 66%);
  filter:blur(18px);
  opacity:.7;
  animation:breathe 8s ease-in-out infinite;
}
.logo-frame{
  width:min(100%,430px);
  aspect-ratio:1/1;
  position:relative;
  animation:float 7s ease-in-out infinite;
}
.logo-frame img{
  width:100%;height:100%;object-fit:contain;display:block;
  filter:drop-shadow(0 12px 28px rgba(0,0,0,.18));
  -webkit-mask-image:radial-gradient(circle at center, #000 43%, rgba(0,0,0,.96) 56%, rgba(0,0,0,.65) 69%, transparent 84%);
  mask-image:radial-gradient(circle at center, #000 43%, rgba(0,0,0,.96) 56%, rgba(0,0,0,.65) 69%, transparent 84%);
}
.content{
  max-width:620px;
}
.kicker{
  margin:0 0 14px;
  color:rgba(247,245,239,.70);
  font-size:11px;
  letter-spacing:.30em;
  text-transform:uppercase;
}
.title{
  margin:0;
  font-weight:700;
  letter-spacing:.03em;
  line-height:1.02;
  font-size:clamp(29px, 3.25vw, 48px);
}
.title.zh{font-size:clamp(34px, 3.7vw, 55px); letter-spacing:.08em;}
.divider{
  width:86px;height:3px;border-radius:999px;
  background:linear-gradient(90deg, var(--accent), rgba(230,166,58,.15));
  margin:19px 0 22px;
}
.slogan{
  margin:0;
  font-weight:400;
  line-height:1.16;
  letter-spacing:-.02em;
  font-size:clamp(28px, 3.3vw, 52px);
}
.slogan.zh{
  font-family:"OAP DaoLi","LiSu","隶书","STLiti","FZLiShu-S01","Noto Serif CJK SC","Noto Serif SC","Songti SC",serif;
  font-weight:400;
  font-size:clamp(26px, 3vw, 42px);
  letter-spacing:.06em;
  line-height:1.4;
}
.services{
  margin:22px 0 0;
  font-size:15px;
  line-height:1.85;
  color:var(--muted);
  letter-spacing:.05em;
}
.email-row{margin-top:21px; display:flex; flex-wrap:wrap; gap:14px; align-items:center;}
.email{
  text-decoration:none;
  color:var(--text);
  display:inline-flex;
  align-items:center;
  gap:10px;
  padding:14px 20px;
  border-radius:999px;
  border:1px solid var(--line-strong);
  background:rgba(255,255,255,.05);
  box-shadow:var(--shadow);
  transition:all .28s ease;
  font-size:14px;
  letter-spacing:.02em;
}
.email:hover{transform:translateY(-2px); border-color:rgba(230,166,58,.46); background:rgba(255,255,255,.08);}
.email::before{content:"✉"; color:var(--accent); font-size:15px;}
.status{margin-top:22px;color:var(--accent);font-size:13px;letter-spacing:.14em;}
.footer{
  margin-top:0;
  padding:0 0 16px;
  text-align:center;
  align-self:end;
  color:rgba(247,245,239,.55);
  font-size:12px;
  letter-spacing:.08em;
}
[data-fade]{opacity:0; transform:translateY(18px); animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards;}
[data-fade="1"]{animation-delay:.08s}
[data-fade="2"]{animation-delay:.18s}
[data-fade="3"]{animation-delay:.3s}
[data-fade="4"]{animation-delay:.42s}
[data-fade="5"]{animation-delay:.56s}
.swap{animation:swap .35s ease both}
@keyframes rise{to{opacity:1; transform:translateY(0)}}
@keyframes swap{from{opacity:.18; transform:translateY(8px)} to{opacity:1; transform:translateY(0)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes breathe{0%,100%{transform:scale(1); opacity:.65}50%{transform:scale(1.04); opacity:.9}}
@media (max-width: 900px){
  .page{width:min(100%, calc(100% - 28px));}
  .header{padding:16px 0 4px;}
  .hero{padding:0 0 18px;}
  .wrap{grid-template-columns:1fr; gap:18px; text-align:center; transform:none;}
  .logo-frame{width:min(54vw,290px);}
  .logo-zone::before{width:min(78vw,380px); height:min(78vw,380px);}
  .divider{margin:18px auto 20px;}
  .email-row{justify-content:center;}
  .services{font-size:13px;}
  .title{font-size:clamp(27px, 6vw, 40px)}
  .title.zh{font-size:clamp(31px, 7vw, 45px)}
  .slogan{font-size:clamp(23px, 5.1vw, 35px)}
  .slogan.zh{font-size:clamp(22px, 4.8vw, 33px)}
  .status{margin-top:14px;}
  .footer{text-align:center;}
}
@media (max-height: 760px){
  .logo-frame{width:min(34vh,350px);}
  .kicker{margin-bottom:10px;}
  .divider{margin:18px 0 18px;}
  .services{margin-top:18px;}
  .email-row{margin-top:22px;}
}
@media (max-height:690px) and (max-width:900px){
  .logo-frame{width:min(35svh,220px)}
  .wrap{gap:6px}
  .kicker{margin-bottom:5px}
  .divider{margin:9px auto 12px}
  .services{margin-top:9px}
  .email-row{margin-top:10px}
  .status{margin-top:9px}
  .footer{padding-bottom:9px}
}
@media (max-width:370px){.email{font-size:12px;padding:11px 13px}.page{width:calc(100% - 20px)}}
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{animation:none !important; transition:none !important;}
  [data-fade]{opacity:1; transform:none;}
}

/* Company name sits in the upper-left, away from the central slogan. */
.site-name{font-weight:650;font-size:clamp(16px,1.7vw,23px);letter-spacing:.13em;color:var(--text);line-height:1.3;max-width:65%;}
#title,#kicker{display:none!important}
@media(max-width:900px){.site-name{font-size:clamp(12px,3.4vw,18px);letter-spacing:.055em;max-width:57%}.header{gap:10px}.language-control select{min-width:134px;font-size:12px;padding:10px 27px 10px 27px}.language-control::before{left:11px}}
@media(max-width:380px){.site-name{max-width:50%;font-size:12px}.language-control select{min-width:125px}}

/* Typography system: understated header, expressive literary slogan. */
.site-name{font-family:"Avenir Next",Avenir,"Helvetica Neue",Arial,sans-serif;font-weight:600;letter-spacing:.115em;}
html:lang(zh-CN) .site-name,html:lang(zh-TW) .site-name{
  font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;
  font-weight:500;
  letter-spacing:.15em;
}
.slogan:not(.zh){
  font-family:"Iowan Old Style","Baskerville","Palatino Linotype","Book Antiqua",Georgia,serif;
  font-weight:400;
  letter-spacing:-.023em;
  line-height:1.25;
  text-wrap:balance;
}
.slogan.zh{
  font-family:"OAP DaoLi","LiSu","隶书","STLiti","FZLiShu-S01","Noto Serif CJK SC","Noto Serif SC","Songti SC",serif;
  font-weight:400;
  font-size:clamp(32px,3.7vw,52px);
  line-height:1.4;
  letter-spacing:.09em;
  text-wrap:balance;
}
.services{font-weight:400;letter-spacing:.075em;}
html:lang(zh-CN) .services,html:lang(zh-TW) .services{letter-spacing:.085em;}
.status{font-weight:500;letter-spacing:.12em;}
.footer{font-weight:400;letter-spacing:.08em;}
@media(max-width:900px){.slogan.zh{font-size:clamp(27px,5.5vw,37px);letter-spacing:.045em;}}
@media(max-width:380px){.slogan.zh{font-size:clamp(23px,5.2vw,30px);letter-spacing:.015em;}}
</style>
</head>
